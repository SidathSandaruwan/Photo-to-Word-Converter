name: Build Debug APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies and build web assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            npx cap init "Photo to Word" "com.sidath.phototoword" --web-dir=dist
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
